name: notifications
on:
  schedule:
    - cron: "0 6 * * *"      # 09:00 Riyadh — morning
    - cron: "0 18 * * *"     # 21:00 Riyadh — evening reminder
    - cron: "*/15 * * * *"   # every 15 min — "cleaning done" alert
  workflow_dispatch:
    inputs:
      mode: { description: "morning | check | evening", default: "morning" }
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: send
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          HOUSE_ID: ${{ secrets.HOUSE_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 6 * * *' && 'morning') || (github.event.schedule == '0 18 * * *' && 'evening') || 'check' }}
        run: node scripts/notify.mjs
